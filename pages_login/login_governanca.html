<!DOCTYPE HTML>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <title>Login Governança</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    
    <link rel="stylesheet" href="../assets/css/main.css" />
    <noscript><link rel="stylesheet" href="../assets/css/noscript.css" /></noscript>
    
    <style>
        #header { margin-top: 2rem; }
        #main { display: flex !important; align-items: center; justify-content: center; }
        #main article { 
            display: block !important; 
            opacity: 1 !important; 
            transform: translateY(0) !important; 
            margin-top: 0 !important;
        }
    </style>
</head>
<body class="is-preload">

    <div id="wrapper">

        <header id="header">
            <div class="logo">
                <span class="icon fa-gem"></span>
            </div>
        </header>

        <div id="main">
            <article id="login-form">

                <div id="area-login">
                    <h2 class="major" id="titulo-login">Login Corporativo</h2>
                    <p style="text-align: center; font-size: 0.9em; margin-top: -15px;">
                        Utilize seu usuário e senha da rede.
                    </p>
                    <form id="form-auth">
                        <div class="fields">
                            <div class="field">
                                <label for="username">Usuário (Rede):</label>
                                <input type="text" id="username" name="username" placeholder="Ecadop" required />
                            </div>
                            <div class="field">
                                <label for="password">Senha:</label>
                                <input type="password" id="password" name="password" required />
                            </div>
                        </div>
                        <ul class="actions">
                            <li><button type="submit" id="btn-login" class="primary">Entrar</button></li>
                            <li><a href="/index.html#navegar" class="button">Voltar</a></li>
                        </ul>
                    </form>
                </div>

            </article>

        </div>

        <footer id="footer">
            <p class="copyright">&copy; Sistema de governança</p>
        </footer>
    </div>

    <div id="bg"></div>

    <script src="../assets/js/jquery.min.js"></script>
    <script src="../assets/js/browser.min.js"></script>
    <script src="../assets/js/breakpoints.min.js"></script>
    <script src="../assets/js/util.js"></script>
    <script src="../assets/js/main.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', function() { // Correção: C maiúsculo

        const divClose = document.querySelector('.close');
        if (divClose) {
            divClose.addEventListener('click', function() {
                // Redireciona para a página inicial do site
                window.location.href = '/index.html#navegar';
            });
        }

        const formAuth = document.getElementById('form-auth');
        const btnLogin = document.getElementById('btn-login');

        if(formAuth) {
            formAuth.addEventListener('submit', async function(event) {
                event.preventDefault(); // Evita o envio padrão do formulário

                btnLogin.innerText = "Autenticando na Rede...";
                btnLogin.disabled = true;

                const usernameVal = document.getElementById('username').value.trim();
                const passwordVal = document.getElementById('password').value;

                try {
                    // Correção: Barra inicial na URL para garantir o caminho absoluto
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            username: usernameVal,   // Correção: Agora as variáveis coincidem
                            password: passwordVal,   // Correção: Agora as variáveis coincidem
                            modulo_id: 1             // 1 = login_compliance
                        })
                    });

                    const result = await response.json();

                    if (response.ok && result.sucesso) {
                        btnLogin.innerText = "Acesso Permitido!";
                        // Confirme se esse caminho da pasta é exatamente este no seu servidor
                        window.location.href = "/src/components/page_painel_governanca/html/" + result.url_destino;
                    } else {
                        alert("Acesso negado: " + (result.mensagem || "Credenciais incorretas."));
                        btnLogin.innerText = "Entrar";
                        btnLogin.disabled = false; 
                    }
                } catch (error) {
                    console.error("Erro na autenticação:", error);
                    alert("Ocorreu um erro durante a conexão com o servidor.");
                    btnLogin.innerText = "Entrar";
                    btnLogin.disabled = false; 
                }
            });
        }
    });
</script>

</body>
</html>
