<!DOCTYPE HTML>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <title>Login Gestão de Medidas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    
    <link rel="stylesheet" href="/assets/css/main.css" />
    <noscript><link rel="stylesheet" href="/assets/css/noscript.css" /></noscript>
    
    <style>
        #header { margin-top: 2rem; }
        #main { display: flex !important; align-items: center; justify-content: center; }
        #main article { 
            display: block !important; 
            opacity: 1 !important; 
            transform: translateY(0) !important; 
            margin-top: 0 !important;
        }
    </style>
</head>
<body class="is-preload">

    <div id="wrapper">

        <header id="header">
            <div class="logo">
                <span class="icon fa-gem"></span>
            </div>
        </header>

        <div id="main">

            <article id="login-form">
                <h2 class="major" id="titulo-login">Login Gestão de Medidas</h2>

                <form id="form-auth">
                    <div class="fields">
                        <div class="field">
                            <label for="username">Usuário:</label>
                            <input type="text" id="username" name="username" required />
                        </div>
                        <div class="field">
                            <label for="password">Senha:</label>
                            <input type="password" id="password" name="password" required />
                        </div>
                    </div>
                    
                    <ul class="actions">
                        <li><button type="submit" id="btn-login" class="primary">Entrar</button></li>
                        <li><a href="/index.html#navegar" class="button">Voltar</a></li>
                    </ul>
                </form>

            </article>

        </div>

        <footer id="footer">
            <p class="copyright">&copy; Seu Sistema. Design base: <a href="https://html5up.net">HTML5 UP</a>.</p>
        </footer>

    </div>

    <div id="bg"></div>

    <script src="/assets/js/jquery.min.js"></script>
    <script src="/assets/js/browser.min.js"></script>
    <script src="/assets/js/breakpoints.min.js"></script>
    <script src="/assets/js/util.js"></script>
    <script src="/assets/js/main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const formAuth = document.getElementById('form-auth');
            const btnLogin = document.getElementById('btn-login');

            if(formAuth) {
                formAuth.addEventListener('submit', async function(event) {
                    event.preventDefault(); // Impede a página de recarregar

                    btnLogin.innerText = "Validando...";
                    btnLogin.disabled = true;

                    // Pega o que o usuário digitou
                    const username = document.getElementById('username').value;
                    const password = document.getElementById('password').value;

                    try {
                        // Bate na porta do nosso servidor Node.js
                        const response = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            // AQUI ESTÁ A MÁGICA: Adicionamos o modulo_id: 5
                            body: JSON.stringify({ username: username, password: password, modulo_id: 5 })
                        });

                        const result = await response.json();

                        // Se o Node.js disser que a senha está certa...
                        if (response.ok && result.sucesso) {
                            btnLogin.innerText = "Entrando...";
                            // O backend já nos devolve a url_destino correta!
                            window.location.href = "/pages/" + result.url_destino; 
                        } else {
                            // Se a senha estiver errada, avisa na tela
                            alert("Acesso negado: " + (result.mensagem || "Usuário ou senha incorretos."));
                            btnLogin.innerText = "Entrar";
                            btnLogin.disabled = false;
                        }
                    } catch (error) {
                        console.error("Erro de conexão:", error);
                        alert("Erro ao conectar com o servidor Node.js. Verifique se ele está rodando!");
                        btnLogin.innerText = "Entrar";
                        btnLogin.disabled = false;
                    }
                });
            }
        });
    </script>

</body>
</html>
