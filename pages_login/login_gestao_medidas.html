<!DOCTYPE HTML>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <title>Login Gestão de Medidas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    
    <link rel="stylesheet" href="/assets/css/main.css" />
    <noscript><link rel="stylesheet" href="/assets/css/noscript.css" /></noscript>
    
    <style>
        #header { margin-top: 2rem; }
        #main { display: flex !important; align-items: center; justify-content: center; }
        #main article { 
            display: block !important; 
            opacity: 1 !important; 
            transform: translateY(0) !important; 
            margin-top: 0 !important;
        }
    </style>
</head>
<body class="is-preload">

    <div id="wrapper">
        <header id="header">
            <div class="logo">
                <span class="icon fa-gem"></span>
            </div>
        </header>

        <div id="main">
            <article id="login-form">
                
                <div id="area-login">
                    <h2 class="major" id="titulo-login">Login Corporativo</h2>
                    <p style="text-align: center; font-size: 0.9em; margin-top: -15px;">
                        Utilize seu usuário e senha da rede.
                    </p>
                    <form id="form-auth">
                        <div class="fields">
                            <div class="field">
                                <label for="username">Usuário (Rede):</label>
                                <input type="text" id="username" name="username" placeholder="Ecadop" required />
                            </div>
                            <div class="field">
                                <label for="password">Senha:</label>
                                <input type="password" id="password" name="password" required />
                            </div>
                        </div>
                        <ul class="actions">
                            <li><button type="submit" id="btn-login" class="primary">Entrar</button></li>
                            <li><a href="/index.html#navegar" class="button">Voltar</a></li>
                        </ul>
                    </form>
                </div>

            </article>
        </div>

        <footer id="footer">
            <p class="copyright">&copy; Sistema de Gestão de Medidas Disciplinares.</p>
        </footer>
    </div>

    <div id="bg"></div>

    <script src="/assets/js/jquery.min.js"></script>
    <script src="/assets/js/browser.min.js"></script>
    <script src="/assets/js/breakpoints.min.js"></script>
    <script src="/assets/js/util.js"></script>
    <script src="/assets/js/main.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // --- CORREÇÃO DO SOFT LOCK  ---
        const divClose = document.querySelector('.close');
        if (divClose) {
            divClose.addEventListener('click', function() {
                window.location.href = '/index.html#navegar'; 
            });
        }

        const formAuth = document.getElementById('form-auth');
        const btnLogin = document.getElementById('btn-login');

        // --- LÓGICA DO FORMULÁRIO DE LOGIN ---
        if(formAuth) {
            formAuth.addEventListener('submit', async function(event) {
                event.preventDefault();
                
                btnLogin.innerText = "Autenticando na Rede...";
                btnLogin.disabled = true;

                const usernameVal = document.getElementById('username').value.trim();
                const passwordVal = document.getElementById('password').value;

                try {
                    // Envia as credenciais para o backend Node.js (que fará a validação LDAP)
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            username: usernameVal, 
                            password: passwordVal, 
                            modulo_id: 5 // Identifica a tabela login_gestao_medidas
                        })
                    });

                    const result = await response.json();

                    if (response.ok && result.sucesso) {
                        btnLogin.innerText = "Acesso Permitido!";
                        
                        // O "../" faz o navegador sair da pasta do login e entrar na pasta do painel
                        // O caminho exato a partir da raiz do servidor
                        window.location.href = "/src/components/page_painel_gestao_medidas/html/" + result.url_destino;                        
                    } else {
                        // AD rejeitou a senha ou o usuário foi inativado na tabela local
                        alert("Acesso negado: " + (result.mensagem || "Credenciais incorretas."));
                        btnLogin.innerText = "Entrar";
                        btnLogin.disabled = false;
                    }
                } catch (error) {
                    console.error("Erro:", error);
                    alert("Erro de conexão com o servidor de autenticação.");
                    btnLogin.innerText = "Entrar";
                    btnLogin.disabled = false;
                }
            });
        }
    });
</script>

</body>
</html>
